name: Snapshot stats and deploy page

on:
  schedule:
    # Obsidian refreshes its stats file around 00:30 UTC; run a couple of hours later.
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'plugins.json', 'scripts/**', '.github/workflows/**']

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node --test scripts/snapshot.test.mjs
      - name: Take snapshot
        run: node scripts/snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: stats snapshot $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # picks up the snapshot commit made in the previous job
      - name: Cache-bust page assets
        run: sed -i -E "s#(app\.js|style\.css)\?v=[A-Za-z0-9]+#\1?v=${GITHUB_SHA::8}#g" docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
